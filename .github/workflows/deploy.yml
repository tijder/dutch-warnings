name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux desktop dependencies installeren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            xvfb

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Site-URLs berekenen
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "SITE_URL=https://${CUSTOM_DOMAIN}" >> $GITHUB_ENV
            echo "BASE_HREF=/" >> $GITHUB_ENV
            echo "DOCS_BASE_URL=/docs/" >> $GITHUB_ENV
          else
            echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> $GITHUB_ENV
            echo "BASE_HREF=/${REPO_NAME}/" >> $GITHUB_ENV
            echo "DOCS_BASE_URL=/${REPO_NAME}/docs/" >> $GITHUB_ENV
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Vertalingen genereren
        run: flutter gen-l10n

      - name: Router genereren (auto_route)
        run: dart run build_runner build

      - name: Flutter Linux desktop inschakelen
        run: flutter config --enable-linux-desktop

      - name: Screenshots genereren
        run: xvfb-run flutter test -d linux integration_test/screenshots_test.dart

      - name: Flutter web bouwen
        run: flutter build web --release --wasm --no-web-resources-cdn --base-href "$BASE_HREF"

      - name: 404.html aanmaken voor SPA-routing
        run: cp build/web/index.html build/web/404.html

      - name: Docusaurus dependencies installeren
        run: npm ci
        working-directory: website

      - name: Docusaurus bouwen
        run: npm run build
        working-directory: website
        env:
          DOCUSAURUS_BASE_URL: ${{ env.DOCS_BASE_URL }}
          DOCUSAURUS_URL: ${{ env.SITE_URL }}

      - name: Outputs samenvoegen
        run: |
          mkdir _site
          cp -r build/web/. _site/
          mkdir _site/docs
          cp -r website/build/. _site/docs/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
