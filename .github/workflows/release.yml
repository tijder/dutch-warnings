name: Daily Release

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ── Check for changes since last tag ─────────────────────────────
      - name: Check for changes
        id: check
        run: |
          LATEST_TAG=$(git tag --sort=-version:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "No tags yet — first release"
          elif [ "$(git rev-list "$LATEST_TAG"..HEAD --count)" = "0" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes since $LATEST_TAG, skipping"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes found since $LATEST_TAG"
          fi

      # ── Determine date-based version ──────────────────────────────────
      - name: Determine version
        if: steps.check.outputs.has_changes == 'true'
        id: version
        run: |
          BASE=$(date +'%Y.%-m.%-d')
          TAG="v$BASE"
          COUNTER=0
          while git rev-parse "$TAG" >/dev/null 2>&1; do
            COUNTER=$((COUNTER + 1))
            TAG="v$BASE.$COUNTER"
          done
          echo "tag=$TAG"                        >> $GITHUB_OUTPUT
          echo "version=${TAG#v}"                >> $GITHUB_OUTPUT
          echo "build_number=$(date +'%Y%m%d')"  >> $GITHUB_OUTPUT

      # ── System deps ───────────────────────────────────────────────────
      - name: Install Linux build deps
        if: steps.check.outputs.has_changes == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.check.outputs.has_changes == 'true'
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Flutter pub get + codegen
        if: steps.check.outputs.has_changes == 'true'
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build

      - name: Analyze and test
        if: steps.check.outputs.has_changes == 'true'
        run: |
          flutter analyze
          flutter test --exclude-tags golden

      # ── Bump pubspec version and commit ───────────────────────────────
      - name: Bump pubspec version
        if: steps.check.outputs.has_changes == 'true'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BUILD=${{ steps.version.outputs.build_number }}
          sed -i "s/^version: .*/version: $VERSION+$BUILD/" pubspec.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git push origin main

      # ── Android APK (debug-signed) ────────────────────────────────────
      - name: Build Android APK
        if: steps.check.outputs.has_changes == 'true'
        run: flutter build apk --release

      # ── Linux tarball ─────────────────────────────────────────────────
      - name: Build Linux
        if: steps.check.outputs.has_changes == 'true'
        run: |
          flutter build linux --release
          tar -czf dutch-warnings-linux-${{ steps.version.outputs.version }}.tar.gz \
            -C build/linux/x64/release/bundle .

      # ── Tag (points at version-bump commit) ───────────────────────────
      - name: Create tag
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      # ── GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        if: steps.check.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Dutch Warnings ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            dutch-warnings-linux-${{ steps.version.outputs.version }}.tar.gz
